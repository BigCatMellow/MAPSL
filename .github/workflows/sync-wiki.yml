name: Sync agent onboarding wiki

on:
  push:
    branches:
      - main
    paths:
      - docs/wiki/**
      - tools/project_wiki_links.py
      - .github/workflows/sync-wiki.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    # Publication remains disabled until the owner authorizes successor cutover.
    if: ${{ github.repository == 'BigCatMellow/MAPSL' && github.ref == 'refs/heads/main' && vars.MAPS_WIKI_PUBLISH == 'ON' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical wiki source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Clone live GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-out

      - name: Replace wiki projection from reviewed source
        run: |
          find wiki-out -maxdepth 1 -type f -name '*.md' -delete
          cp docs/wiki/*.md wiki-out/
          python3 tools/project_wiki_links.py wiki-out "$GITHUB_REPOSITORY" "$GITHUB_SHA"

      - name: Publish only when content changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd wiki-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki already matches canonical source."
            exit 0
          fi
          git commit -m "Sync agent onboarding wiki from main"
          git push origin HEAD
