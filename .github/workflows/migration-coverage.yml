name: Migration coverage

on:
  pull_request:
  push:
    branches: [main, 'migration/**']

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_migration*.py' -v
      - run: python3 migration/check_inventory.py
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify no active legacy dependency remains
        run: python scripts/check_legacy_removal_readiness.py
      - name: Validate installer syntax and nonmutating preview
        run: |
          bash -n scripts/install_maps.sh
          test ! -e .venv && test ! -e .maps && test ! -e .hcom
          bash scripts/install_maps.sh
          test ! -e .venv && test ! -e .maps && test ! -e .hcom
          test -z "$(git status --porcelain)"
      - name: Install existing pinned test dependencies
        run: |
          python -m pip install -r runtime/requirements.txt
          python -m pip install ruff==0.16.3 bandit==1.9.4
      - name: Compile and fatal lint
        run: |
          python -m compileall -q runtime tests
          ruff check runtime tests --select E9,F63,F7,F82
      - name: Medium/high security static analysis
        run: bandit -q -r runtime -ll -s B608
      - name: Verify dependencies
        run: python -m pip check
      - name: Run original and migration tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -v
      - name: Disposable smoke
        if: always()
        run: python -m runtime.smoke --with-langgraph
